name: CI

# The single entry point for push/PR checks. Test, lint, security, image
# build/scan and infra validation live in reusable workflows (workflow_call)
# so their jobs can share one `needs:` graph. GitHub cannot `needs:` across
# separate workflow files, which is what previously left the deploy job
# unaware of test results.
#
# Branch protection requires exactly one status check: `ci-gate`. It fails
# unless every gated job succeeded, so renaming or adding a job inside a
# reusable workflow cannot silently detach a required check. Docs:
# docs/runbooks/ci-deployment.md.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs, but never cancel a master run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  lint:
    uses: ./.github/workflows/lint.yml

  security:
    uses: ./.github/workflows/security.yml

  build:
    uses: ./.github/workflows/build.yml

  infra:
    uses: ./.github/workflows/validate-infra.yml

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs: [test, lint, security, build, infra]
    # Run even when a dependency failed or was cancelled, so the required
    # check reports a failure instead of staying "skipped"/"expected".
    if: always()
    steps:
      - name: Every gated job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::ci-gate: gated jobs did not succeed: $failed"
            exit 1
          fi

  deploy:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [ci-gate]
    # Implicit success(): runs only when ci-gate passed, i.e. tests, lint,
    # security, image scan, DAST, load test and infra validation all
    # succeeded for this exact commit.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          # NEXT_PUBLIC_* values are compiled into the bundle (and the CSP),
          # so the API origin must be known at build time. Set the repository
          # variable PUBLIC_API_URL (Settings > Secrets and variables >
          # Actions > Variables), e.g. https://app.example.com/api/v1. Unset,
          # it falls back to the same-origin path /api/v1, which is what the
          # k8s Ingress serves.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || '/api/v1' }}
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
