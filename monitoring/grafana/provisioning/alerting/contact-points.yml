apiVersion: 1

# Grafana-managed alerts (alerts.yml) are forwarded to the same Alertmanager
# that Prometheus uses, so both rule sets share one routing tree and one set of
# receivers (monitoring/alertmanager/alertmanager.yml). Without this, Grafana
# falls back to its built-in email contact point, which has no SMTP configured.
contactPoints:
  - orgId: 1
    name: alertmanager
    receivers:
      - uid: alertmanager
        type: prometheus-alertmanager
        settings:
          url: http://alertmanager:9093
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: alertmanager
    group_by: ['grafana_folder', 'alertname']
