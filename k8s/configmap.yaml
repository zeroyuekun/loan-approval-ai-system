apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-approval-config
  namespace: loan-approval
  labels:
    app.kubernetes.io/name: loan-approval
    app.kubernetes.io/part-of: aussieloanai
data:
  DJANGO_SETTINGS_MODULE: config.settings.production
  # config/settings/production.py refuses to start without this. It must
  # contain the Ingress host; the backend probes send the same Host header.
  DJANGO_ALLOWED_HOSTS: app.aussieloanai.com.au
  # Broker/cache URLs carry the Redis password, so they live in the Secret
  # (see secrets.env.example).
  POSTGRES_DB: loan_approval_db
  # With terraform, set this to the `rds_endpoint` output (host part only).
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
