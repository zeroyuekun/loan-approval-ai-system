apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-io
  namespace: loan-approval
  labels:
    app.kubernetes.io/name: celery-worker-io
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: aussieloanai
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker-io
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker-io
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: aussieloanai
    spec:
      automountServiceAccountToken: false
      # Dockerfile: adduser (Debian) creates appuser at UID/GID 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Hold the worker until the db-migrate Job has brought the schema up to
      # this image's migrations (see k8s/backend/migrate-job.yaml).
      initContainers:
        - name: wait-for-migrations
          image: ghcr.io/OWNER/loan-approval-ai-system/backend:latest
          command:
            - sh
            - -c
            - until python manage.py migrate --check >/dev/null; do echo "waiting for db-migrate Job"; sleep 5; done
          envFrom:
            - configMapRef:
                name: loan-approval-config
            - secretRef:
                name: loan-approval-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
      containers:
        - name: celery-worker-io
          image: ghcr.io/OWNER/loan-approval-ai-system/backend:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # `celery` is Celery's default queue. Tasks with no route in
          # config/celery.py land there, including apps.loans.tasks.*
          # (enforce_data_retention, retry_failed_dispatches). Matches
          # docker-compose.yml's celery_worker_io.
          command:
            - celery
            - -A
            - config
            - worker
            - -l
            - info
            - -Q
            - email,agents,celery
            - --concurrency=4
            - --prefetch-multiplier=1
          env:
            # Root filesystem is read-only; libraries that write under $HOME
            # (gunicorn's control socket, matplotlib's cache) use /tmp instead.
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: loan-approval-config
            - secretRef:
                name: loan-approval-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The decision pipeline loads the active model from here.
            - name: ml-models
              mountPath: /app/ml_models
              readOnly: true
          # -d pins the ping to this pod's own worker; without it any worker
          # that answers keeps a hung one "alive".
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A config inspect ping -d "celery@$HOSTNAME" --timeout 10
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 15
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A config inspect ping -d "celery@$HOSTNAME" --timeout 10
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 15
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: ml-models
          persistentVolumeClaim:
            claimName: ml-models
