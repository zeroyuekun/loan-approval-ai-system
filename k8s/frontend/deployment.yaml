apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: loan-approval
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: aussieloanai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: aussieloanai
    spec:
      automountServiceAccountToken: false
      # frontend/Dockerfile ends with `USER 100:101` (appuser/appgroup as
      # created by Alpine `adduser -S`). The kubelet can only verify
      # runAsNonRoot against a numeric UID; with `USER appuser` and no
      # runAsUser it refuses to start the container (CreateContainerConfigError).
      # build.yml's docker-build job fails if the image UID drifts from 100.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/OWNER/loan-approval-ai-system/frontend:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Root filesystem is read-only: point npm's cache/log dir at /tmp.
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Next.js writes its image-optimisation and fetch cache here.
            - name: next-cache
              mountPath: /app/.next/cache
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            initialDelaySeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
