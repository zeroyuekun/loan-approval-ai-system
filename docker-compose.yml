services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loan_approval}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default password — compose refuses to start unless set in .env.
      # Prevents shipping a known-weak credential to any environment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting the stack}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - internal

  backend:
    build: ./backend
    image: loan-approval-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-loan_approval}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting the stack}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 120 --max-requests 1000 --max-requests-jitter 100 --access-logfile -
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/", "--connect-timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal

  celery_worker_ml:
    image: loan-approval-backend
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting the stack}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
    volumes:
      - ./backend:/app
    # Concurrency 1: training holds a Redis lock so only one run executes at a
    # time anyway, and a single XGBoost+Optuna run already saturates available
    # CPU. Scheduled drift/fairness tasks queue briefly behind training (both
    # are non-latency-sensitive).
    #
    # --max-tasks-per-child=5 recycles the worker process after every 5
    # completed tasks so any accumulated native state (XGBoost/OpenMP threads,
    # Optuna memory, file descriptors) gets cleaned up and zombie tasks cannot
    # run indefinitely past their time_limit.
    #
    # -E (task events) feeds celery-exporter, which is how Prometheus sees task
    # runtime and failures: worker processes expose no /metrics endpoint.
    command: celery -A config worker -l info -E -Q ml --concurrency 1 --max-tasks-per-child 5 --prefetch-multiplier 1
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - internal

  celery_worker_io:
    image: loan-approval-backend
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting the stack}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
    volumes:
      - ./backend:/app
    # --prefetch-multiplier 1 matches celery_worker_ml so each of the 4 IO
    # worker threads reserves at most 1 task at a time (H28 — without this,
    # the global worker_prefetch_multiplier=2 allows up to 8 tasks reserved
    # by one worker, delaying fairness across queues). -E: see celery_worker_ml.
    command: celery -A config worker -l info -E -Q email,agents,celery --concurrency 4 --prefetch-multiplier 1
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout 10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - internal

  celery_beat:
    image: loan-approval-backend
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting the stack}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
    volumes:
      - ./backend:/app
    # Use Celery's default PersistentScheduler. The beat schedule is defined in
    # code (config/celery.py -> app.conf.beat_schedule), so the DatabaseScheduler
    # from django-celery-beat is unnecessary — and that package is NOT a dependency
    # (requirements ships django-celery-results, a different package), so forcing
    # the override crash-loops beat with ModuleNotFoundError. Do not re-add it
    # without also adding django-celery-beat to requirements + INSTALLED_APPS.
    command: >
      celery -A config beat -l info
        --pidfile /tmp/celerybeat.pid
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - internal

  watchdog:
    image: loan-approval-backend
    build: ./backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting the stack}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DJANGO_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
    volumes:
      - ./backend:/app
    command: python manage.py watchdog --interval 30
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      # Cap Node heap below the container mem_limit so a runaway
      # Next.js process exits gracefully instead of being killed with code 243.
      # See docs/runbooks/frontend-exit-243.md.
      NODE_OPTIONS: "--max-old-space-size=768"
    mem_limit: 1g
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - frontend_next:/app/.next
      - frontend_node_modules:/app/node_modules
    # user: root moved to docker-compose.override.yml (the dev-only bind-mount
    # workaround), so a bare `docker compose -f docker-compose.yml up` runs the
    # frontend as the image's non-root appuser. Command unchanged from prior.
    command: sh -c "npm ci && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - internal

  # --- Local LLM for free, private email generation (opt-in) ---
  # Start with: docker compose --profile ollama up -d ollama ollama-init
  # When EMAIL_LLM_BACKEND=ollama but these aren't running, email generation
  # degrades cleanly to the deterministic template (ConnectError -> fallback),
  # so the default stack is unaffected.
  ollama:
    image: ollama/ollama:latest  # pin a version for reproducibility, e.g. ollama/ollama:0.5.7
    profiles: ["ollama"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'      # inference is CPU-bound; give it threads
          memory: 8G       # qwen2.5:7b Q4 ~5GB weights + 16k KV-cache headroom
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"        # keep the model warm between emails
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal

  # One-shot: pull the base model and bake the 16k-context `loan-email` model,
  # then exit. Re-runs are cheap (model cached in the named volume).
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull qwen2.5:7b &&
       ollama create loan-email -f /models/Modelfile &&
       echo 'ollama loan-email model ready'"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./ollama:/models:ro
    restart: "no"
    networks:
      - internal

  # --- Monitoring stack (opt-in via: docker compose --profile monitoring up) ---
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: loan-approval-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    # The backend /metrics scrape authenticates with X-Health-Token read from
    # /run/secrets/health_check_token (see monitoring/prometheus.yml).
    secrets:
      - health_check_token
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  # grafana moved to docker-compose.monitoring.yml so the main stack parses
  # without forcing GRAFANA_ADMIN_PASSWORD on developers who don't use the
  # monitoring profile. See docker-compose.monitoring.yml for the service.

  loki:
    image: grafana/loki:3.4.2
    container_name: loan-approval-loki
    profiles: ["monitoring"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  promtail:
    image: grafana/promtail:3.4.2
    container_name: loan-approval-promtail
    profiles: ["monitoring"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - internal

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: loan-approval-alertmanager
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - internal

  # PLACEHOLDER alert receiver. Alertmanager posts every notification here and
  # this stub prints the payload to its log (visible in Loki/Grafana), so the
  # alert path can be tested end to end. Replace the receiver in
  # monitoring/alertmanager/alertmanager.yml with Slack/email/PagerDuty for
  # real paging; this service then becomes unnecessary.
  alert-sink:
    image: python:3.13-alpine
    container_name: loan-approval-alert-sink
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - python
      - -c
      - |
        import http.server, json, sys
        class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                try:
                    p = json.loads(body)
                    for a in p.get("alerts", []):
                        print("ALERT", a.get("status"), a.get("labels", {}).get("alertname"), a.get("labels", {}).get("severity"), a.get("annotations", {}).get("summary"), flush=True)
                except ValueError:
                    print("ALERT unparsable payload", body[:200], flush=True)
                self.send_response(200)
                self.end_headers()
            def log_message(self, *args):
                pass
        http.server.HTTPServer(("0.0.0.0", 9095), H).serve_forever()
    networks:
      - internal

  celery-exporter:
    image: danihodovic/celery-exporter:0.10.13
    container_name: loan-approval-celery-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9808:9808"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CE_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Workers run with -E; the exporter turns those task events into
      # celery_task_* metrics. Buckets reach 600s so the pipeline SLO alert
      # (p95 > 60s) can be computed; the default buckets stop at 10s.
      CE_BUCKETS: "0.1,0.25,0.5,1,2.5,5,10,30,60,120,300,600"
      CE_QUEUES: "ml,email,agents,celery"
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: loan-approval-postgres-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting the stack}@db:5432/${POSTGRES_DB:-loan_approval}?sslmode=disable"
    networks:
      - internal

networks:
  internal:
    driver: bridge

secrets:
  # Read from HEALTH_CHECK_TOKEN in .env / the shell. Mounted only into
  # Prometheus (monitoring profile); the backend reads the env var directly.
  health_check_token:
    environment: HEALTH_CHECK_TOKEN

volumes:
  postgres_data:
  redis_data:
  loki_data:
  prometheus_data:
  # grafana_data is declared in docker-compose.monitoring.yml
  frontend_next:
  frontend_node_modules:
  ollama_models:  # pulled Ollama models persist here (opt-in `ollama` profile)
